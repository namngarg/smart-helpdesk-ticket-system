<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd8b8"/>
            <stop offset="100%" stop-color="#f3b988"/>
        </linearGradient>
        <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e9ecff"/>
        </linearGradient>
    </defs>

    <circle cx="200" cy="200" r="170" fill="#ffffff" opacity="0.12"/>
    <circle cx="200" cy="210" r="140" fill="#ffffff" opacity="0.1"/>

    <!-- desk -->
    <rect x="70" y="300" width="260" height="18" rx="9" fill="#ffffff" opacity="0.55"/>
    <rect x="95" y="318" width="20" height="40" fill="#ffffff" opacity="0.35"/>
    <rect x="285" y="318" width="20" height="40" fill="#ffffff" opacity="0.35"/>

    <!-- monitor -->
    <rect x="150" y="190" width="100" height="75" rx="8" fill="#ffffff"/>
    <rect x="160" y="200" width="80" height="8" rx="4" fill="#c7cdfb"/>
    <rect x="160" y="214" width="60" height="8" rx="4" fill="#c7cdfb"/>
    <rect x="160" y="228" width="70" height="8" rx="4" fill="#c7cdfb"/>
    <circle cx="225" cy="248" r="9" fill="#22c55e"/>
    <path d="M221 248l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="188" y="265" width="24" height="10" fill="#ffffff"/>
    <rect x="175" y="275" width="50" height="8" rx="4" fill="#ffffff"/>

    <!-- body -->
    <rect x="160" y="230" width="80" height="90" rx="26" fill="url(#shirtGrad)"/>

    <!-- head -->
    <circle cx="200" cy="175" r="38" fill="url(#skinGrad)"/>

    <!-- headset -->
    <path d="M163 170a37 37 0 0 1 74 0" stroke="#4f46e5" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="156" y="166" width="14" height="22" rx="7" fill="#4f46e5"/>
    <rect x="230" y="166" width="14" height="22" rx="7" fill="#4f46e5"/>
    <path d="M237 186v10a6 6 0 0 1-6 6h-6" stroke="#4f46e5" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="223" cy="203" r="4" fill="#4f46e5"/>

    <!-- floating ticket -->
    <g transform="translate(78 110) rotate(-8)">
        <rect width="70" height="50" rx="10" fill="#ffffff"/>
        <circle cx="12" cy="25" r="6" fill="#eef1fb"/>
        <rect x="24" y="12" width="36" height="7" rx="3.5" fill="#ec4899"/>
        <rect x="24" y="24" width="30" height="6" rx="3" fill="#c7cdfb"/>
        <rect x="24" y="34" width="22" height="6" rx="3" fill="#c7cdfb"/>
    </g>

    <!-- floating chat bubble -->
    <g transform="translate(260 95) rotate(6)">
        <path d="M0 10a10 10 0 0 1 10-10h50a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H22l-12 10V46H10A10 10 0 0 1 0 36Z" fill="#ffffff"/>
        <circle cx="18" cy="23" r="4" fill="#4f46e5"/>
        <circle cx="35" cy="23" r="4" fill="#4f46e5"/>
        <circle cx="52" cy="23" r="4" fill="#4f46e5"/>
    </g>

    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.8">
        <circle cx="110" cy="250" r="4"/>
        <circle cx="300" cy="230" r="3"/>
        <circle cx="305" cy="160" r="3"/>
        <circle cx="95" cy="190" r="3"/>
    </g>
</svg>
